name: Plugin checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-model-thinking-package
          path: dsh-model-thinking-*.tgz
